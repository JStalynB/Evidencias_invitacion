<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6dfe8">
<title>¿Quieres salir conmigo?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💖%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --fondo-1: #f8e3ec;
    --fondo-2: #e6e0f7;
    --tarjeta: #fffafc;
    --texto: #a8335a;
    --texto-suave: #b8607d;
    --verde: #34a853;
    --verde-oscuro: #278741;
    --rojo: #e0412f;
    --rojo-oscuro: #bf3223;
    --lila: #b7a8ee;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: "Fredoka", ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--texto);
    background: linear-gradient(160deg, var(--fondo-1), var(--fondo-2));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }

  .tarjeta {
    position: relative;
    width: min(100%, 380px);
    min-height: 440px;
    background: var(--tarjeta);
    border-radius: 28px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(168, 51, 90, .18);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .propuesta, .exito { display: flex; flex-direction: column; align-items: center; width: 100%; flex: 1; }
  .exito { display: none; justify-content: center; }
  .acepto .propuesta { display: none; }
  .acepto .exito { display: flex; animation: aparece .6s ease both; }
  @keyframes aparece { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }

  h1 {
    margin: 0 0 18px;
    font-size: clamp(1.4rem, 6vw, 1.75rem);
    font-weight: 600;
    line-height: 1.25;
  }

  .ilustracion {
    width: 210px;
    max-width: 72%;
    aspect-ratio: 230 / 180;
    border-radius: 18px;
    background: linear-gradient(145deg, #c9bdf3, #a9b9f0);
    padding: 6px;
    margin-bottom: 22px;
  }
  .ilustracion.feliz { background: linear-gradient(145deg, #d8f0e4, #f7e1ee); }
  .ilustracion svg, .ilustracion img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 14px; }

  .corazon-flota { transform-origin: 115px 34px; animation: latido 1.6s ease-in-out infinite; }
  .salto { animation: salto 1s ease-in-out infinite; transform-origin: 115px 170px; }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes salto { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .botones {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 52px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    color: #fff;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 999px;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, background .2s ease;
  }
  button:focus-visible { outline: 3px solid var(--lila); outline-offset: 3px; }
  button:active { transform: scale(.96); }

  #si { background: var(--verde); box-shadow: 0 6px 16px rgba(52, 168, 83, .35); }
  #si:active { background: var(--verde-oscuro); }
  #no { background: var(--rojo); box-shadow: 0 6px 16px rgba(224, 65, 47, .3); z-index: 4; }
  #no:active { background: var(--rojo-oscuro); }

  .subtexto {
    margin: 16px 0 0;
    min-height: 1.5em;
    color: var(--texto-suave);
    font-size: 1rem;
  }

  .exito p { margin: 0; max-width: 30ch; color: var(--texto-suave); line-height: 1.45; }
  .exito h1 { margin-bottom: 18px; }

  .wa {
    display: none;
    margin-top: 16px;
    background: #25d366;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    padding: 10px 22px;
    border-radius: 999px;
  }

  .lluvia { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .lluvia span { position: absolute; top: -40px; animation: cae linear forwards; }
  @keyframes cae { to { transform: translateY(110vh) rotate(var(--giro, 40deg)); opacity: .9; } }

  @media (prefers-reduced-motion: reduce) {
    .corazon-flota, .salto { animation: none; }
    .lluvia { display: none; }
    .acepto .exito { animation: none; }
  }
</style>
</head>

<body>
  <main class="tarjeta" id="tarjeta">

    <!-- Pantalla 1: la pregunta -->
    <section class="propuesta">
      <h1 id="titulo">¿Quieres salir conmigo? <span aria-hidden="true">💖</span></h1>

      <div class="ilustracion" id="ilustracion">
        <svg viewBox="0 0 230 180" role="img" aria-label="Un osito y un panda juntos">
          <ellipse cx="70" cy="160" rx="36" ry="26" fill="#c9976b"/>
          <ellipse cx="160" cy="160" rx="36" ry="26" fill="#ffffff"/>
          <!-- oso -->
          <circle cx="40" cy="62" r="15" fill="#c9976b"/>
          <circle cx="100" cy="62" r="15" fill="#c9976b"/>
          <circle cx="40" cy="62" r="8" fill="#e9c4a0"/>
          <circle cx="100" cy="62" r="8" fill="#e9c4a0"/>
          <circle cx="70" cy="98" r="44" fill="#c9976b"/>
          <circle cx="57" cy="94" r="4.2" fill="#3a2a2a"/>
          <circle cx="83" cy="94" r="4.2" fill="#3a2a2a"/>
          <ellipse cx="70" cy="110" rx="15" ry="11" fill="#f3dcc3"/>
          <ellipse cx="70" cy="105" rx="4.5" ry="3.2" fill="#3a2a2a"/>
          <path d="M64 113 Q70 119 76 113" stroke="#3a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="48" cy="108" r="6" fill="#f2a1b6" opacity=".7"/>
          <circle cx="92" cy="108" r="6" fill="#f2a1b6" opacity=".7"/>
          <!-- panda -->
          <circle cx="130" cy="64" r="15" fill="#2b2b33"/>
          <circle cx="190" cy="64" r="15" fill="#2b2b33"/>
          <circle cx="160" cy="98" r="42" fill="#ffffff" stroke="#e4dcf1" stroke-width="2"/>
          <ellipse cx="146" cy="95" rx="9" ry="11" fill="#2b2b33" transform="rotate(-18 146 95)"/>
          <ellipse cx="174" cy="95" rx="9" ry="11" fill="#2b2b33" transform="rotate(18 174 95)"/>
          <circle cx="147" cy="94" r="3.4" fill="#fff"/>
          <circle cx="173" cy="94" r="3.4" fill="#fff"/>
          <ellipse cx="160" cy="108" rx="5" ry="3.6" fill="#2b2b33"/>
          <path d="M154 114 Q160 120 166 114" stroke="#2b2b33" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="138" cy="110" r="6" fill="#f2a1b6" opacity=".7"/>
          <circle cx="182" cy="110" r="6" fill="#f2a1b6" opacity=".7"/>
          <path class="corazon-flota" d="M115 46 C100 33 105 20 115 26 C125 20 130 33 115 46 Z" fill="#e0527f"/>
        </svg>
      </div>

      <div class="botones" id="botones">
        <button id="si" type="button">¡Sí!</button>
        <button id="no" type="button">No</button>
      </div>
      <p class="subtexto" id="subtexto" aria-live="polite"></p>
    </section>

    <!-- Pantalla 2: dijo que sí -->
    <section class="exito" aria-live="polite">
      <h1 id="titulo-exito">¡Gooo! Vamos a ver una peli <span aria-hidden="true">🎬 💖</span></h1>

      <div class="ilustracion feliz" id="ilustracion-feliz">
        <svg viewBox="0 0 230 180" role="img" aria-label="El osito y el panda abrazados y felices">
          <g class="salto">
            <!-- cuerpos -->
            <ellipse cx="84" cy="160" rx="34" ry="24" fill="#c9976b"/>
            <ellipse cx="148" cy="160" rx="34" ry="24" fill="#ffffff" stroke="#e4dcf1" stroke-width="2"/>
            <!-- oso -->
            <circle cx="52" cy="60" r="15" fill="#c9976b"/>
            <circle cx="112" cy="60" r="15" fill="#c9976b"/>
            <circle cx="52" cy="60" r="8" fill="#e9c4a0"/>
            <circle cx="112" cy="60" r="8" fill="#e9c4a0"/>
            <circle cx="82" cy="96" r="44" fill="#c9976b"/>
            <path d="M65 93 Q70 86 75 93" stroke="#3a2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M89 93 Q94 86 99 93" stroke="#3a2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
            <ellipse cx="82" cy="108" rx="15" ry="11" fill="#f3dcc3"/>
            <ellipse cx="82" cy="103" rx="4.5" ry="3.2" fill="#3a2a2a"/>
            <path d="M74 110 Q82 122 90 110 Z" fill="#8c3b4a"/>
            <circle cx="58" cy="106" r="6" fill="#f2a1b6" opacity=".8"/>
            <circle cx="106" cy="106" r="6" fill="#f2a1b6" opacity=".8"/>
            <!-- panda -->
            <circle cx="118" cy="62" r="15" fill="#2b2b33"/>
            <circle cx="178" cy="62" r="15" fill="#2b2b33"/>
            <circle cx="148" cy="96" r="42" fill="#ffffff" stroke="#e4dcf1" stroke-width="2"/>
            <ellipse cx="134" cy="93" rx="9" ry="11" fill="#2b2b33" transform="rotate(-18 134 93)"/>
            <ellipse cx="162" cy="93" rx="9" ry="11" fill="#2b2b33" transform="rotate(18 162 93)"/>
            <path d="M129 92 Q134 86 139 92" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M157 92 Q162 86 167 92" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <ellipse cx="148" cy="106" rx="5" ry="3.6" fill="#2b2b33"/>
            <path d="M140 109 Q148 121 156 109 Z" fill="#8c3b4a"/>
            <circle cx="126" cy="108" r="6" fill="#f2a1b6" opacity=".8"/>
            <circle cx="170" cy="108" r="6" fill="#f2a1b6" opacity=".8"/>
            <!-- brazos que se abrazan -->
            <path d="M96 138 Q116 150 138 136" stroke="#c9976b" stroke-width="12" fill="none" stroke-linecap="round"/>
            <path d="M104 142 Q120 150 134 142" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" opacity="0"/>
          </g>
          <path class="corazon-flota" d="M115 30 C100 17 105 4 115 10 C125 4 130 17 115 30 Z" fill="#e0527f"/>
          <path d="M26 40 C20 33 22 26 27 29 C32 26 34 33 26 40 Z" fill="#f2a1b6"/>
          <path d="M204 44 C198 37 200 30 205 33 C210 30 212 37 204 44 Z" fill="#f2a1b6"/>
        </svg>
      </div>

      <p id="texto-exito"></p>
      <a class="wa" id="wa" target="_blank" rel="noopener">Escríbeme por WhatsApp 💬</a>
    </section>
  </main>

  <div class="lluvia" id="lluvia" aria-hidden="true"></div>

<script>
/* ============================================================
   CONFIGURACIÓN: lo único que tienes que cambiar está aquí
   ============================================================ */
const CONFIG = {
  // Nombre de ella (aparece en tu notificación)
  NOMBRE: "Carito",

  // Canal de notificaciones (ntfy.sh). Debe ser único y difícil de adivinar.
  // En tu teléfono instala la app "ntfy" y suscríbete a ESTE mismo nombre.
  NTFY_CANAL: "carito-4eje7m7nsf",

  // Textos de la pantalla final (después de que ella toca "¡Sí!")
  TEXTO_FINAL: "¡Espero que estés emocionada como yo! Nos vemos en la doble",

  // Frases que aparecen bajo los botones cada vez que ella toca "No".
  // En el último toque el botón "No" desaparece y solo queda "¡Sí!".
  RESPUESTAS_NO: [
    "Piénsalo otra vez",
    "No me hagas esto",
    "Estoy empezando a llorar...",
    "Eres cruel 😢"
  ],

  // Opcional: te avisa también cuando ella abre la página
  AVISAR_AL_ABRIR: false,

  // Opcional: tu número con código de país, sin "+" ni espacios (ej. 593991234567).
  // Si lo llenas, ella verá un botón para escribirte por WhatsApp al aceptar.
  WHATSAPP: "",

  // Opcional: tus propias imágenes o GIFs (suben junto al index.html). Vacío = dibujos incluidos.
  IMAGEN: "",
  IMAGEN_FELIZ: ""
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const tarjeta = $("tarjeta");
const botonSi = $("si");
const botonNo = $("no");
const subtexto = $("subtexto");

let intentos = 0;

$("texto-exito").textContent = CONFIG.TEXTO_FINAL;

/* ---------- Imágenes propias (opcional) ---------- */
function ponerImagen(ruta, contenedor) {
  if (!ruta) return;
  const img = new Image();
  img.alt = "";
  img.onload = () => contenedor.replaceChildren(img);
  img.src = ruta;
}
ponerImagen(CONFIG.IMAGEN, $("ilustracion"));
ponerImagen(CONFIG.IMAGEN_FELIZ, $("ilustracion-feliz"));

/* ---------- Notificación al teléfono ---------- */
async function avisar(titulo, mensaje, etiquetas, prioridad) {
  if (!CONFIG.NTFY_CANAL) return false;
  // Sin cabeceras personalizadas (evita bloqueos del navegador): todo va en la URL.
  const url = "https://ntfy.sh/" + encodeURIComponent(CONFIG.NTFY_CANAL)
    + "?title=" + encodeURIComponent(titulo)
    + "&tags=" + encodeURIComponent(etiquetas)
    + "&priority=" + prioridad;

  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(url, { method: "POST", body: mensaje, keepalive: true });
      if (r.ok) return true;
    } catch (e) { /* reintenta */ }
    await new Promise((ok) => setTimeout(ok, 1500));
  }
  return false;
}

function hora() {
  return new Date().toLocaleString("es-EC", { dateStyle: "medium", timeStyle: "short" });
}

if (CONFIG.AVISAR_AL_ABRIR) {
  avisar("Abrió tu mensaje", CONFIG.NOMBRE + " abrió la página (" + hora() + ")", "eyes", 3);
}

/* ---------- Botón "No": huye por la pantalla ---------- */
function moverNo() {
  botonNo.style.position = "fixed";
  const w = botonNo.offsetWidth;
  const h = botonNo.offsetHeight;
  const margen = 8;
  const maxX = Math.max(margen, window.innerWidth - w - margen);
  const maxY = Math.max(margen, window.innerHeight - h - margen);
  const si = botonSi.getBoundingClientRect();
  let x = margen, y = margen;

  // Busca un lugar que no tape el botón "¡Sí!"
  for (let i = 0; i < 40; i++) {
    x = margen + Math.random() * (maxX - margen);
    y = margen + Math.random() * (maxY - margen);
    const tapa = x < si.right + 16 && x + w > si.left - 16 && y < si.bottom + 16 && y + h > si.top - 16;
    if (!tapa) break;
  }
  botonNo.style.left = x + "px";
  botonNo.style.top = y + "px";
}

botonNo.addEventListener("click", () => {
  intentos++;
  const frases = CONFIG.RESPUESTAS_NO;
  subtexto.textContent = frases[Math.min(intentos - 1, frases.length - 1)];
  if (navigator.vibrate) navigator.vibrate(20);

  if (intentos >= frases.length) {
    botonNo.style.display = "none";   // ya no hay opción: solo queda "¡Sí!"
  } else {
    moverNo();
  }
});

// Si cambia el tamaño o se gira el teléfono, el "No" vuelve a un lugar visible
window.addEventListener("resize", () => {
  if (botonNo.style.position === "fixed" && botonNo.style.display !== "none") moverNo();
});

/* ---------- Botón "¡Sí!" ---------- */
botonSi.addEventListener("click", () => {
  if (tarjeta.classList.contains("acepto")) return;
  tarjeta.classList.add("acepto");
  botonNo.style.display = "none";
  lluviaDeCorazones();
  if (navigator.vibrate) navigator.vibrate([60, 40, 60]);

  if (CONFIG.WHATSAPP) {
    const wa = $("wa");
    wa.href = "https://wa.me/" + CONFIG.WHATSAPP + "?text=" + encodeURIComponent("¡Dije que sí! 💖");
    wa.style.display = "inline-block";
  }

  const detalle = intentos > 0
    ? " Tocó \u201cNo\u201d " + intentos + (intentos === 1 ? " vez" : " veces") + " antes."
    : " Dijo que sí a la primera.";
  avisar(
    CONFIG.NOMBRE + " dijo que SÍ 💚",
    "¡Aceptó salir contigo! (" + hora() + ")." + detalle,
    "green_heart,tada",
    5
  );
});

/* ---------- Corazones ---------- */
function lluviaDeCorazones() {
  const caja = $("lluvia");
  const emojis = ["💖", "💗", "💕", "💘", "🌸", "🎬"];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement("span");
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 16 + Math.random() * 22 + "px";
    s.style.animationDuration = 2.8 + Math.random() * 2.6 + "s";
    s.style.animationDelay = Math.random() * 1.6 + "s";
    s.style.setProperty("--giro", (Math.random() * 120 - 60) + "deg");
    caja.appendChild(s);
    setTimeout(() => s.remove(), 8000);
  }
}
</script>
</body>
</html>
