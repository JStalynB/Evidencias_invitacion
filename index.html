<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6dfe8">
<title>¿Quieres salir conmigo?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💖%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --fondo-1: #f8e3ec;
    --fondo-2: #e6e0f7;
    --tarjeta: #fffafc;
    --texto: #a8335a;
    --texto-suave: #c0728d;
    --verde: #34a853;
    --verde-oscuro: #278741;
    --rosa: #e0527f;
    --lila: #b7a8ee;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: "Fredoka", ui-rounded, "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--texto);
    background: linear-gradient(160deg, var(--fondo-1), var(--fondo-2));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }

  .tarjeta {
    position: relative;
    width: min(100%, 380px);
    min-height: 420px;
    background: var(--tarjeta);
    border-radius: 28px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(168, 51, 90, .18);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin: 0 0 18px;
    font-size: clamp(1.45rem, 6.2vw, 1.8rem);
    font-weight: 600;
    line-height: 1.2;
  }

  .ilustracion {
    width: 200px;
    max-width: 70%;
    aspect-ratio: 230 / 180;
    border-radius: 18px;
    background: linear-gradient(145deg, #c9bdf3, #a9b9f0);
    padding: 6px;
    margin-bottom: 22px;
  }
  .ilustracion svg, .ilustracion img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 14px; }

  .corazon-flota { transform-origin: 115px 34px; animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

  .botones {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 120px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 3px solid var(--lila); outline-offset: 3px; }

  #si {
    background: var(--verde);
    color: #fff;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 12px 34px;
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(52, 168, 83, .35);
    transition: transform .2s ease, background .2s ease;
    transform-origin: center;
  }
  #si:active { background: var(--verde-oscuro); transform: scale(.97); }

  #por-favor {
    background: transparent;
    color: var(--texto-suave);
    font-size: .95rem;
    padding: 8px 14px;
    transition: transform .2s ease, opacity .2s ease;
  }

  /* Pantalla de respuesta */
  .propuesta { display: contents; }
  .exito { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 10px; }
  .acepto .propuesta { display: none; }
  .acepto .exito { display: flex; animation: aparece .6s ease both; }
  @keyframes aparece { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }

  .exito .grande { font-size: 4rem; line-height: 1; }
  .exito h2 { margin: 0; font-size: 1.7rem; font-weight: 600; }
  .exito p { margin: 0; max-width: 28ch; color: var(--texto-suave); line-height: 1.4; }

  .wa {
    display: none;
    margin-top: 10px;
    background: #25d366;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    padding: 10px 22px;
    border-radius: 999px;
  }

  /* Corazones de celebración */
  .lluvia { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .lluvia span {
    position: absolute;
    top: -40px;
    animation: cae linear forwards;
  }
  @keyframes cae {
    to { transform: translateY(110vh) rotate(var(--giro, 40deg)); opacity: .9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .corazon-flota { animation: none; }
    .lluvia { display: none; }
    .acepto .exito { animation: none; }
  }
</style>
</head>

<body>
  <main class="tarjeta" id="tarjeta">

    <section class="propuesta">
      <h1 id="titulo">¿Quieres salir conmigo? <span aria-hidden="true">💖</span></h1>

      <div class="ilustracion" id="ilustracion">
        <!-- Si pones tu propia imagen en config (IMAGEN), reemplaza este dibujo -->
        <svg viewBox="0 0 230 180" role="img" aria-label="Un osito y un panda abrazados">
          <!-- cuerpos -->
          <ellipse cx="70" cy="160" rx="36" ry="26" fill="#c9976b"/>
          <ellipse cx="160" cy="160" rx="36" ry="26" fill="#ffffff"/>
          <!-- oso -->
          <circle cx="40" cy="62" r="15" fill="#c9976b"/>
          <circle cx="100" cy="62" r="15" fill="#c9976b"/>
          <circle cx="40" cy="62" r="8" fill="#e9c4a0"/>
          <circle cx="100" cy="62" r="8" fill="#e9c4a0"/>
          <circle cx="70" cy="98" r="44" fill="#c9976b"/>
          <circle cx="57" cy="94" r="4.2" fill="#3a2a2a"/>
          <circle cx="83" cy="94" r="4.2" fill="#3a2a2a"/>
          <ellipse cx="70" cy="110" rx="15" ry="11" fill="#f3dcc3"/>
          <ellipse cx="70" cy="105" rx="4.5" ry="3.2" fill="#3a2a2a"/>
          <path d="M64 113 Q70 119 76 113" stroke="#3a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="48" cy="108" r="6" fill="#f2a1b6" opacity=".7"/>
          <circle cx="92" cy="108" r="6" fill="#f2a1b6" opacity=".7"/>
          <!-- panda -->
          <circle cx="130" cy="64" r="15" fill="#2b2b33"/>
          <circle cx="190" cy="64" r="15" fill="#2b2b33"/>
          <circle cx="160" cy="98" r="42" fill="#ffffff" stroke="#e4dcf1" stroke-width="2"/>
          <ellipse cx="146" cy="95" rx="9" ry="11" fill="#2b2b33" transform="rotate(-18 146 95)"/>
          <ellipse cx="174" cy="95" rx="9" ry="11" fill="#2b2b33" transform="rotate(18 174 95)"/>
          <circle cx="147" cy="94" r="3.4" fill="#fff"/>
          <circle cx="173" cy="94" r="3.4" fill="#fff"/>
          <ellipse cx="160" cy="108" rx="5" ry="3.6" fill="#2b2b33"/>
          <path d="M154 114 Q160 120 166 114" stroke="#2b2b33" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="138" cy="110" r="6" fill="#f2a1b6" opacity=".7"/>
          <circle cx="182" cy="110" r="6" fill="#f2a1b6" opacity=".7"/>
          <!-- corazón -->
          <path class="corazon-flota" d="M115 46 C100 33 105 20 115 26 C125 20 130 33 115 46 Z" fill="#e0527f"/>
        </svg>
      </div>

      <div class="botones">
        <button id="si" type="button">¡Sí!</button>
        <button id="por-favor" type="button">Por favor...</button>
      </div>
    </section>

    <section class="exito" aria-live="polite">
      <div class="grande" aria-hidden="true">🥰</div>
      <h2 id="titulo-exito">¡Siii!</h2>
      <p id="texto-exito">Acabo de recibir la mejor noticia del día.</p>
      <a class="wa" id="wa" target="_blank" rel="noopener">Escríbeme por WhatsApp 💬</a>
    </section>
  </main>

  <div class="lluvia" id="lluvia" aria-hidden="true"></div>

<script>
/* ============================================================
   CONFIGURACIÓN: lo único que tienes que cambiar está aquí
   ============================================================ */
const CONFIG = {
  // Nombre de ella (aparece en el mensaje final y en tu notificación)
  NOMBRE: "Carito",

  // Canal de notificaciones (ntfy.sh). Debe ser único y difícil de adivinar.
  // En tu teléfono instala la app "ntfy" y suscríbete a ESTE mismo nombre.
  NTFY_CANAL: "carito-4eje7m7nsf",

  // Opcional: te avisa también cuando ella abre la página
  AVISAR_AL_ABRIR: false,

  // Opcional: tu número con código de país y sin "+" ni espacios (ej. 593991234567).
  // Si lo llenas, ella verá un botón para escribirte por WhatsApp al aceptar.
  WHATSAPP: "",

  // Opcional: ruta de tu propia imagen o GIF (ej. "imagen.gif"). Vacío = dibujo incluido.
  IMAGEN: "",

  // Frases del botón "Por favor..." cada vez que lo toca
  FRASES: [
    "Por favor...",
    "Piénsalo otra vez",
    "¿Segura?",
    "Mira que soy buena gente",
    "Te prometo helado",
    "Me vas a hacer llorar",
    "Último intento...",
    "Ya, di que sí"
  ]
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const tarjeta = $("tarjeta");
const botonSi = $("si");
const botonNo = $("por-favor");

let intentos = 0;

/* ---------- Imagen propia (opcional) ---------- */
if (CONFIG.IMAGEN) {
  const img = new Image();
  img.alt = "";
  img.onload = () => { $("ilustracion").replaceChildren(img); };
  img.src = CONFIG.IMAGEN;
}

/* ---------- Notificación al teléfono ---------- */
async function avisar(titulo, mensaje, etiquetas, prioridad) {
  if (!CONFIG.NTFY_CANAL) return false;
  // Sin cabeceras personalizadas para evitar bloqueos del navegador: todo va en la URL.
  const url = "https://ntfy.sh/" + encodeURIComponent(CONFIG.NTFY_CANAL)
    + "?title=" + encodeURIComponent(titulo)
    + "&tags=" + encodeURIComponent(etiquetas)
    + "&priority=" + prioridad;

  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(url, { method: "POST", body: mensaje, keepalive: true });
      if (r.ok) return true;
    } catch (e) { /* reintenta */ }
    await new Promise((ok) => setTimeout(ok, 1500));
  }
  return false;
}

function hora() {
  return new Date().toLocaleString("es-EC", { dateStyle: "medium", timeStyle: "short" });
}

if (CONFIG.AVISAR_AL_ABRIR) {
  avisar("Abrió tu mensaje", CONFIG.NOMBRE + " abrió la página (" + hora() + ")", "eyes", 3);
}

/* ---------- Botón "Por favor..." ---------- */
botonNo.addEventListener("click", () => {
  intentos++;
  const frases = CONFIG.FRASES;
  botonNo.textContent = frases[Math.min(intentos, frases.length - 1)];

  // El "Sí" crece y el otro botón se encoge
  const crecer = Math.min(1 + intentos * 0.28, 2.6);
  const encoger = Math.max(1 - intentos * 0.09, 0.55);
  botonSi.style.transform = "scale(" + crecer + ")";
  botonNo.style.transform = "scale(" + encoger + ")";
  // Espacio para que el "Sí" agrandado no tape el otro botón
  document.querySelector(".botones").style.gap = (14 + intentos * 14) + "px";
  document.querySelector(".botones").style.paddingTop = (intentos * 10) + "px";

  if (navigator.vibrate) navigator.vibrate(20);
});

/* ---------- Botón "¡Sí!" ---------- */
botonSi.addEventListener("click", async () => {
  if (tarjeta.classList.contains("acepto")) return;
  tarjeta.classList.add("acepto");
  $("titulo-exito").textContent = "¡Siii, " + CONFIG.NOMBRE + "!";
  lluviaDeCorazones();
  if (navigator.vibrate) navigator.vibrate([60, 40, 60]);

  if (CONFIG.WHATSAPP) {
    const texto = encodeURIComponent("¡Dije que sí! 💖");
    const wa = $("wa");
    wa.href = "https://wa.me/" + CONFIG.WHATSAPP + "?text=" + texto;
    wa.style.display = "inline-block";
  }

  const detalle = intentos > 0
    ? " Tocó \u201cPor favor...\u201d " + intentos + (intentos === 1 ? " vez" : " veces") + " antes."
    : " Dijo que sí a la primera.";
  avisar(
    CONFIG.NOMBRE + " dijo que SÍ 💚",
    "¡Aceptó salir contigo! (" + hora() + ")." + detalle,
    "green_heart,tada",
    5
  );
});

/* ---------- Corazones ---------- */
function lluviaDeCorazones() {
  const caja = $("lluvia");
  const emojis = ["💖", "💗", "💕", "💘", "🌸"];
  const total = 36;
  for (let i = 0; i < total; i++) {
    const s = document.createElement("span");
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 16 + Math.random() * 22 + "px";
    s.style.animationDuration = 2.8 + Math.random() * 2.6 + "s";
    s.style.animationDelay = Math.random() * 1.6 + "s";
    s.style.setProperty("--giro", (Math.random() * 120 - 60) + "deg");
    caja.appendChild(s);
    setTimeout(() => s.remove(), 8000);
  }
}
</script>
</body>
</html>
